[project]
name = "mortgage-redaction"
version = "0.1.0"
description = "Shared PII detection + true PDF redaction (Presidio + PyMuPDF) for the jev-bakeoff agent and eval harness."
# Pinned to <3.13: the ML stack (spaCy/Presidio/numpy) ships no cp314 wheels, so
# every consumer of this package (the agent image, the eval harness) runs 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pymupdf>=1.24",
    "spacy>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["redaction"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
